<html lang="zh-CN">

<title>NSZGRM 你是中国人吗？</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--ink:#1d293e;--muted:#607089;
  --border:#dce5f0;--blue:#215fbb;--blue-light:#edf4ff;
  --red:#ce414b;--green:#168451;--accent-soft:#edf3fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
main{width:min(100%,1000px);margin:auto;padding:27px 16px 50px}
h1{font-size:clamp(23px,4.7vw,32px);line-height:1.28;letter-spacing:-.025em;margin:0 0 7px}
h2{font-size:18px;line-height:1.4;margin:0 0 15px}
h3{font-size:17px;line-height:1.4;margin:0 0 13px}
h4{font-size:15px;line-height:1.4;margin:20px 0 9px}
.sub{font-size:13px;color:var(--muted);margin:0 0 21px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:22px;margin-bottom:15px;box-shadow:0 5px 22px #1c395c07}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick label{border:1px solid #cbd8ea;border-radius:10px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.pick label:has(input:checked){border-color:var(--blue);background:#f4f8ff}
.pick input{margin:5px 0 0;accent-color:var(--blue)}
.pick strong{display:block;font-size:16px;font-weight:680}.pick small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 15px;cursor:pointer;min-height:42px}
button.secondary{background:var(--accent-soft);color:#234d87}
button.outline{background:white;border:1px solid #cad7e9;color:#27568b}
button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.50;cursor:default}
.status{margin:0;font-size:15px;min-height:24px;color:var(--muted)}
.status.ok{color:#237450}.status.error{color:#ad2334}
.download-progress{margin-top:13px}
.download-progress[hidden]{display:none}
.download-progress-info{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:13px;margin-bottom:6px}
.download-progress-info span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.download-progress-track{height:9px;overflow:hidden;background:#e8eef7;border-radius:8px}
.download-progress-bar{height:100%;width:0;background:var(--blue);border-radius:8px;transition:width .15s ease}
.download-progress-track.indeterminate .download-progress-bar{width:35%;animation:model-download-indeterminate 1.2s ease-in-out infinite}
.download-progress.error .download-progress-bar{background:var(--red)}
@keyframes model-download-indeterminate{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.download-progress-bar{transition:none}.download-progress-track.indeterminate .download-progress-bar{animation:none;width:100%;opacity:.35}}
#file{display:none}
.input-row{display:flex;align-items:stretch;gap:10px}
#name{border:1px solid #c7d3e2;border-radius:9px;min-width:0;flex:1;font:inherit;font-size:22px;padding:9px 13px;background:#fff;color:var(--ink)}
#run{min-width:88px}
.conversion-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:14px}
.conversion-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.conversion-row input{margin:0;accent-color:var(--blue)}

.conversion-warning[hidden]{display:none}

.score-item.primary .score-number{font-size:56px}
.score-item.primary .score-percent{font-size:28px}
.score-item.secondary .score-number,.score-item.secondary .score-percent{font-size:28px}
.score-separator{color:var(--ink);font-size:28px;font-weight:400}
.category-line{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow-x:auto;scrollbar-width:thin;margin:1px 0 15px;font-size:15px}
.category-separator{color:var(--ink)}
.bar{height:11px;border-radius:8px;background:#e8eef7;overflow:hidden;margin:10px 0 13px}
.bar>div{height:100%;width:0;border-radius:8px}
.verdict{border:1px solid #d6e2f4;background:var(--blue-light);border-radius:10px;padding:13px 15px;margin:12px 0;font-size:20px;font-weight:750;line-height:1.45}
.verdict.native{background:#edf4ff;border-color:#d4e2f8}
.verdict.japanese{background:#fff0f1;border-color:#f1cdd0}
.verdict.foreign{background:#edf8f1;border-color:#cce7d5}
.rule-note{background:#fdf7ec;border:1px solid #efdfc0;color:#82570f;border-radius:9px;padding:11px 13px;font-size:13px;margin:12px 0}
.divider{height:1px;border:0;background:var(--border);margin:26px 0 24px}
.language-line{display:flex;align-items:baseline;gap:0;flex-wrap:wrap;line-height:1.4;margin:2px 0 12px}
.language-primary{display:inline-flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-weight:750;line-height:1.28}
.language-primary .lang-name,.language-primary .lang-number{font-size:56px}

.language-tail{display:inline;align-self:baseline;font-size:15px;line-height:1.8;white-space:normal}
.language-tail .entry{display:inline-block;white-space:nowrap}
.language-tail .slash{color:var(--ink);padding:0 8px}
.language-verdict{border:1px solid #d7e2ee;background:#f5f8fd;border-radius:10px;padding:13px 15px;margin:12px 0;font-size:20px;font-weight:750}
.tablewrap{overflow-x:auto;scrollbar-width:thin}
table{border-collapse:collapse;width:100%;min-width:max-content;font-size:13px}
th,td{text-align:left;padding:9px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-weight:650;color:#405670}td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.raw-fusion td{font-weight:750;background:#f7faff}

@media(max-width:620px){
 main{padding:16px 9px 32px}.card{padding:15px}
 .pick{grid-template-columns:1fr}
 .controls button{flex:1 1 auto}
 .score-item.primary .score-number,.language-primary .lang-name,.language-primary .lang-number{font-size:46px}

 .verdict,.language-verdict{font-size:18px}
 .language-primary{gap:6px}
}

<script>
(function(root) {
'use strict';
const minuscule=1e-30;

function decodeWeights(t){
 if(Array.isArray(t))return t.map(row=>Float32Array.from(row));
 if(!['sym_int8_per_row_v1','sym_int16_per_row_v1'].includes(t.quant_format))throw Error('Unsupported quant format');
 if(t._decoded)return t._decoded;
 const n=t.shape.reduce((a,b)=>a*b,1), width=n/t.shape[0];
 const raw=atob(t.data_b64),int16=t.quant_format==='sym_int16_per_row_v1';
 if(raw.length!==n*(int16?2:1))throw Error('Quantized tensor byte count mismatch');
 const rows=[];
 for(let i=0;i<t.shape[0];i++){
  const row=new Float32Array(width),scale=t.scales[i],off=i*width;
  for(let j=0;j<width;j++){
   let x;if(int16){const v=2*(off+j);x=raw.charCodeAt(v)|(raw.charCodeAt(v+1)<<8);x=x>32767?x-65536:x;}
   else{x=raw.charCodeAt(off+j);x=x>127?x-256:x;}
   row[j]=Math.fround(x*scale);
  }
  rows.push(row);
 }
 Object.defineProperty(t,'_decoded',{value:rows,enumerable:false});
 return rows;
}

function softmax(a){const max=Math.max(...a);const e=a.map(x=>Math.exp(x-max));const s=e.reduce((p,c)=>p+c,0);return e.map(v=>v/s);}
function sigmoid(x){return x>=0 ? 1/(1+Math.exp(-x)) : Math.exp(x)/(1+Math.exp(x));}
function calibrate(p,t){return softmax(p.map(v=>Math.log(Math.max(v,minuscule))/t));}
function normalize(name){const s=String(name||'').normalize('NFKC').trim();return s||null;}
function tfidf(name,m){
 const terms=m.tfidf.vocabulary;const idf=m.tfidf.idf;
 const counts=new Map();const chars=[...name];
 for(let n=1;n<=3;n++)for(let i=0;i<=chars.length-n;i++){
  const key=chars.slice(i,i+n).join('');const idx=terms[key];
  if(idx!==undefined)counts.set(idx,(counts.get(idx)||0)+1);
 }
 const x=new Float64Array(idf.length);let norm=0;
 for(const [idx,cnt] of counts){const v=cnt*idf[idx];x[idx]=v;norm+=v*v;}
 if(norm>0){norm=Math.sqrt(norm);for(const idx of counts.keys())x[idx]/=norm;}
 return x;
}
function linear(name,m,cache){
 const x=cache||tfidf(name,m);const logits=[];
 const coef=decodeWeights(m.coef);
 for(let c=0;c<coef.length;c++){
  const w=coef[c];let z=m.intercept[c];
  for(let j=0;j<x.length;j++)if(x[j])z+=x[j]*w[j];
  logits.push(z);
 }
 if(m.mode==='sigmoid_binary'){const q=sigmoid(logits[0]);return [1-q,q];}
 const p=logits.map(sigmoid);const sum=p.reduce((a,b)=>a+b,0);
 return p.map(v=>v/sum);
}
function complement(name,m,cache){
 const x=cache||tfidf(name,m);const logits=[];
 for(const row of decodeWeights(m.feature_log_prob)){let z=0;
  for(let j=0;j<x.length;j++)if(x[j])z+=row[j]*x[j];
  logits.push(z);
 }
 return softmax(logits);
}
function modelState(m){
 if(m._unpacked)return m._unpacked;
 const o={};for(const [key,value] of Object.entries(m.state)){
  if(['sym_int8_per_row_v1','sym_int16_per_row_v1'].includes(value.quant_format)){
   const rows=decodeWeights(value),w=rows[0].length,buf=new Float32Array(rows.length*w);
   rows.forEach((row,i)=>buf.set(row,i*w));o[key]=buf;
  }else o[key]=Float32Array.from(value.values);
 }
 Object.defineProperty(m,'_unpacked',{value:o,enumerable:false});return o;
}
function neuralTokens(name,m){
 const c=[...name].slice(0,m.max_len),v=m.vocab;
 return c.map(ch=>v[ch]===undefined?1:v[ch]);
}
function vecEmbedding(tokens,state,m){
 const w=state['embedding.weight'];const emb=m.hyperparameters.emb;
 return tokens.map(idx=>w.subarray(idx*emb,(idx+1)*emb));
}
function cnn(name,m){
 const s=modelState(m),seq=neuralTokens(name,m),embedding=vecEmbedding(seq,s,m),E=m.hyperparameters.emb,C=m.hyperparameters.channels;
 const z=[];
 for(let i=0;i<3;i++){
  const kernel=i+2,w=s['convs.'+i+'.weight'],b=s['convs.'+i+'.bias'];
  const activations=new Float64Array(C);activations.fill(-Infinity);
  const nPos=Math.max(1,seq.length-kernel+1);
  for(let p=0;p<nPos;p++)for(let c=0;c<C;c++){
   let a=b[c],offset=c*E*kernel;
   for(let j=0;j<E;j++)for(let k=0;k<kernel;k++){
    if(p+k<embedding.length)a+=w[offset+j*kernel+k]*embedding[p+k][j];
   }
   if(a<0)a=0;
   if(a>activations[c])activations[c]=a;
  }
  for(let c=0;c<C;c++)z.push(activations[c]);
 }
 const head=s['head.weight'],bias=s['head.bias'],logits=[];
 for(let c=0;c<m.classes.length;c++){
  let sum=bias[c];for(let j=0;j<z.length;j++)sum+=head[c*z.length+j]*z[j];
  logits.push(sum);
 }
 return softmax(logits);
}
function rnnStep(vec,prev,wih,whh,bih,bhh,H){
 const E=vec.length;const gates=new Float64Array(H*6);
 for(let i=0;i<H*3;i++){
  let a=bih[i],b=bhh[i];
  for(let e=0;e<E;e++)a+=wih[i*E+e]*vec[e];
  for(let h=0;h<H;h++)b+=whh[i*H+h]*prev[h];
  gates[i]=a;
  // scratch second summand to respect GRU reset-gate formula
  gates[i+H*3]=b;
 }
 const out=new Float64Array(H);
 for(let h=0;h<H;h++){
  const r=sigmoid(gates[h]+gates[h+H*3]);
  const z=sigmoid(gates[H+h]+gates[H+h+H*3]);
  const n=Math.tanh(gates[2*H+h]+r*gates[2*H+h+H*3]);
  out[h]=(1-z)*n+z*prev[h];
 }
 return out;
}
function bigru(name,m){
 const state=modelState(m),tokens=neuralTokens(name,m),emb=vecEmbedding(tokens,state,m),H=m.hyperparameters.hidden;
 const paths=[];
 for(const suffix of ['', '_reverse']){
  let h=new Float64Array(H);
  const wih=state['rnn.weight_ih_l0'+suffix],whh=state['rnn.weight_hh_l0'+suffix],
        bih=state['rnn.bias_ih_l0'+suffix],bhh=state['rnn.bias_hh_l0'+suffix];
  const timesteps=suffix?[...emb].reverse():emb;
  for(const v of timesteps)h=rnnStep(v,h,wih,whh,bih,bhh,H);
  paths.push(...h);
 }
 const weights=state['head.weight'],b=state['head.bias'];const logits=[];
 for(let c=0;c<m.classes.length;c++){
  let z=b[c];for(let h=0;h<2*H;h++)z+=weights[c*2*H+h]*paths[h];
  logits.push(z);
 }
 return softmax(logits);
}
function predictTask(name,task){
 const weights=task.fusion_weights,models=task.models;
 const cache=tfidf(name,models.linear);
 const results={};const final=new Array(task.classes.length).fill(0);
 for(const key of ['linear','complement_nb','cnn','bigru']){
  const model=models[key];if(!model)throw Error('Required model missing: '+key);
  const p=(key==='linear'?linear(name,model,cache):
          key==='complement_nb'?complement(name,model,cache):
          key==='cnn'?cnn(name,model):bigru(name,model));
  const calibrated=calibrate(p,model.temperature);
  const weight=weights[key];
  results[key]={probabilities:calibrated,weight,top:task.classes[calibrated.indexOf(Math.max(...calibrated))]};
  for(let i=0;i<final.length;i++)final[i]+=weight*calibrated[i];
 }
 return {classes:task.classes,model_scores:results,probabilities:final,
   label:task.classes[final.indexOf(Math.max(...final))],
   confidence:Math.max(...final)};
}
function predict(name,bundle){
 const normalized=normalize(name);
 if(!normalized)return {error:'请输入 2–8 个连续汉字；标点、间隔号或非中文姓名请先拆分。'};
 const writing=predictTask(normalized,bundle.models.writing);
 const pidx=writing.classes.indexOf('foreign_phonetic_proxy');
 const score=pidx<0?null:100*writing.probabilities[pidx];
 const result={name:normalized,phonetic_index:score,writing_type:writing,
               note:'分数为弱监督模型融合结果，未经代表性人群校准；不是词源证据。'};
 if(bundle.models.language){result.language_proxy=predictTask(normalized,bundle.models.language);}
 return result;
}
const api={predict,predictTask,normalize,tfidf,linear,complement,cnn,bigru,calibrate};
if(typeof module!=='undefined'&&module.exports)module.exports=api;
root.NSZGRM=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script>

function selected(){return document.querySelector('input[name="variant"]:checked').value;}
function el(tag,content,cls){const n=document.createElement(tag);if(content!==undefined&&content!==null)n.textContent=String(content);if(cls)n.className=cls;return n;}
function status(message,kind=''){const n=$('status');n.textContent=message;n.className='status '+kind;}
function showStatus(){status(active?MODEL_META[active].title+'模型已加载':'无模型加载',active?'ok':'');}
function setBusy(value){busy=value;for(const id of ['load','download','local','restore','clear'])$(id).disabled=value;}
function modelSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MiB':n>=1024?(n/1024).toFixed(1)+' KiB':n+' B';}
function progressStart(file){
  $('download-progress').hidden=false;
  $('download-progress').classList.remove('error');
  $('download-progress-track').classList.add('indeterminate');
  $('download-progress-track').removeAttribute('aria-valuenow');
  $('download-progress-bar').style.width='0';
  $('download-progress-text').textContent='正在下载 '+file;
  $('download-progress-value').textContent='连接中…';
}
function progressUpdate(loaded,total){
  const track=$('download-progress-track');
  if(total>0){
    const percent=Math.min(100,Math.round(100*loaded/total));
    track.classList.remove('indeterminate');
    track.setAttribute('aria-valuenow',String(percent));
    $('download-progress-bar').style.width=percent+'%';
    $('download-progress-value').textContent=percent+'%';
    $('download-progress-text').textContent='已下载 '+modelSize(loaded)+' / '+modelSize(total);
  }else{
    track.classList.add('indeterminate');
    track.removeAttribute('aria-valuenow');
    $('download-progress-value').textContent='下载中…';
    $('download-progress-text').textContent='已下载 '+modelSize(loaded);
  }
}
function progressFinish(message){
  const track=$('download-progress-track');
  track.classList.remove('indeterminate');
  track.setAttribute('aria-valuenow','100');
  $('download-progress-bar').style.width='100%';
  $('download-progress-value').textContent='100%';
  $('download-progress-text').textContent=message;
}
function progressError(error){
  $('download-progress').classList.add('error');
  $('download-progress-track').classList.remove('indeterminate');
  $('download-progress-track').removeAttribute('aria-valuenow');
  $('download-progress-text').textContent='下载失败：'+error.message;
  $('download-progress-value').textContent='';
}
function requestModel(file){
  progressStart(file);
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('GET',new URL(file,document.baseURI),true);
    xhr.responseType='text';
    xhr.onprogress=e=>progressUpdate(e.loaded,e.lengthComputable?e.total:0);
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve(xhr.response);
      else reject(Error('HTTP '+xhr.status));
    };
    xhr.onerror=()=>reject(Error('网络连接失败'));
    xhr.onabort=()=>reject(Error('下载已取消'));
    xhr.send();
  });
}
function resetResult(){ $('result').replaceChildren(el('h2','结果')); }
function validateBundle(obj){
  if(!obj||typeof obj!=='object'||!obj.models||typeof obj.models!=='object')throw Error('模型 JSON 无效');
  for(const [taskName,expected] of [['writing',WRITING_COLUMNS],['language',LANGUAGE_COLUMNS]]){
    const task=obj.models[taskName];
    if(!task||!Array.isArray(task.classes)||task.classes.length!==expected.length||
        !expected.every(x=>task.classes.includes(x)))throw Error((taskName==='writing'?'书写类型':'语言来源')+'模型类别不完整');
    if(!task.models||!task.fusion_weights)throw Error('模型参数不完整');
    for(const arch of ['linear','complement_nb','cnn','bigru']){
      if(!task.models[arch]||!Number.isFinite(Number(task.models[arch].temperature))||Number(task.models[arch].temperature)<=0)throw Error(arch+' 模型参数不完整');
    }
  }
  return obj;
}
function detectVariant(bundle){
  const coef=bundle.models.writing.models.linear.coef;
  return coef&&typeof coef==='object'&&!Array.isArray(coef)&&typeof coef.quant_format==='string'?'quant':'fp32';
}
function parseModel(text){return validateBundle(JSON.parse(text));}
function database(){return new Promise(resolve=>{
  if(!('indexedDB' in window)){resolve(null);return;}
  try{
    const request=indexedDB.open('nszgrm-model-cache-v2',1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('models'))request.result.createObjectStore('models');};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>resolve(null);
    request.onblocked=()=>resolve(null);
  }catch(_){resolve(null);}
});}
async function cacheRead(key){
  const db=await database();if(!db)return null;
  try{return await new Promise(resolve=>{
    const tx=db.transaction('models','readonly');const req=tx.objectStore('models').get(key);
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null);
  });}finally{db.close();}
}
async function cacheWrite(key,text){
  const db=await database();if(!db)return false;
  try{return await new Promise(resolve=>{
    const tx=db.transaction('models','readwrite');tx.objectStore('models').put(text,key);
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);tx.onabort=()=>resolve(false);
  });}finally{db.close();}
}
async function cacheClear(){
  const db=await database();if(!db)return;
  try{await new Promise((resolve,reject)=>{
    const tx=db.transaction('models','readwrite');tx.objectStore('models').clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||Error('缓存清除失败'));
    tx.onabort=()=>reject(tx.error||Error('缓存清除失败'));
  });}finally{db.close();}
}
function activate(key,model){
  MODEL_CACHE.set(key,model);active=key;
  for(const input of document.querySelectorAll('input[name="variant"]'))input.checked=input.value===key;
  resetResult();showStatus();
}
async function loadServer(){
  if(busy)return;
  const key=selected(),file=MODEL_META[key].file;
  setBusy(true);status('正在下载模型……');
  try{
    const raw=await requestModel(file);
    progressFinish('下载完成，正在解析模型……');
    status('正在加载模型……');
    const model=parseModel(raw);
    if(detectVariant(model)!==key)throw Error('模型格式与所选版本不一致');
    await cacheWrite(key,raw);
    activate(key,model);
    progressFinish('模型下载完成');
  }catch(e){progressError(e);status('加载失败：'+e.message,'error');}
  finally{setBusy(false);}
}
function downloadFile(){
  if(busy)return;
  const file=MODEL_META[selected()].file;
  $('download-progress').hidden=true;
  const a=el('a');
  a.href=new URL(file,document.baseURI).href;
  a.download=file;
  document.body.append(a);
  a.click();
  a.remove();
}
async function localFile(file){
  if(!file||busy)return;
  setBusy(true);status('正在加载模型……');
  try{
    const raw=await file.text(),model=parseModel(raw),key=detectVariant(model);
    await cacheWrite(key,raw);activate(key,model);
  }catch(e){status('加载失败：'+e.message,'error');}
  finally{$('file').value='';setBusy(false);}
}
async function restore(){
  if(busy)return;
  const key=selected();setBusy(true);status('正在恢复模型……');
  try{
    let model=MODEL_CACHE.get(key);
    if(!model){const raw=await cacheRead(key);if(!raw)throw Error('浏览器缓存中没有所选模型');model=parseModel(raw);}
    if(detectVariant(model)!==key)throw Error('缓存模型格式与所选版本不一致');
    activate(key,model);
  }catch(e){status('恢复失败：'+e.message,'error');}
  finally{setBusy(false);}
}
async function clearCache(){
  if(busy)return;setBusy(true);
  try{await cacheClear();MODEL_CACHE.clear();active=null;resetResult();showStatus();}
  catch(e){status('清除失败：'+e.message,'error');}
  finally{setBusy(false);}
}
function correctedResult(name,result){
  const rule=EXCEPTIONS[name];
  const writing=result.writing_type;
  const original=writing.probabilities;
  let probabilities=original.slice(),applied=false;
  if(rule&&RULE_FIX_ENABLED){
    const target=writing.classes.indexOf(rule.target);
    if(target>=0){
      const rest=original.reduce((sum,p,i)=>sum+(i===target?0:p),0);
      probabilities=original.map((p,i)=>i===target?0.85:(rest>0?0.15*p/rest:0.15/(original.length-1)));
      applied=true;
    }
  }
  return {probabilities,applied,rule,top:writing.classes[probabilities.indexOf(Math.max(...probabilities))]};
}
function writingName(cls,fixed){
  if(fixed&&fixed.applied&&fixed.rule.target===cls)return (LABELS[cls]||cls)+'（规则修正）';
  return LABELS[cls]||cls;
}
function writingDisplay(parent,task,fixed){
  const ranking=task.classes.map((cls,i)=>({cls,value:fixed.probabilities[i]})).sort((a,b)=>b.value-a.value);
  const scores=el('div',null,'score-line');
  ranking.forEach(({cls,value},i)=>{
    if(i)scores.append(el('span','/','score-separator'));
    const span=el('span',null,'score-item '+(i===0?'primary':'secondary'));
    span.style.color=CLASS_COLORS[cls]||'#1d293e';
    span.append(el('span',(100*value).toFixed(2),'score-number'),el('span','%','score-percent'));
    scores.append(span);
  });
  parent.append(scores);
  const names=el('div',null,'category-line');
  ranking.forEach(({cls},i)=>{if(i)names.append(el('span','/','category-separator'));names.append(el('span',writingName(cls,fixed)));});
  parent.append(names);
  const meter=el('div',null,'bar'),fill=el('div');
  fill.style.width=Math.min(100,Math.max(0,ranking[0].value*100))+'%';
  fill.style.backgroundColor=CLASS_COLORS[ranking[0].cls]||'#215fbb';meter.append(fill);parent.append(meter);
  const verdict=el('div','判断：'+writingName(ranking[0].cls,fixed),'verdict');
  verdict.classList.add(ranking[0].cls==='zh_native'?'native':ranking[0].cls==='ja_kanji_proxy'?'japanese':'foreign');
  parent.append(verdict);
  if(fixed.applied){
    const note=fixed.rule.target==='foreign_phonetic_proxy'
      ?'符合修正规则：这是对模型缺陷的规则修正，故指数是常数85.00%'
      :'符合修正规则：目标类别得分固定为85.00%';
    parent.append(el('div',note,'rule-note'));
  }
}
function languageDisplay(parent,task){
  const groups=[
    {label:'汉语',codes:['zh']},
    {label:'日语',codes:['ja']},
    {label:'韩语',codes:['ko']},
    {label:'欧洲',codes:['de','fr','en','es']},
    {label:'俄语',codes:['ru']}
  ];
  const ranking=groups.map(item=>({
    label:item.label,
    value:item.codes.reduce((sum,cls)=>{
      const idx=task.classes.indexOf(cls);
      return sum+(idx<0?0:task.probabilities[idx]);
    },0)
  })).sort((a,b)=>b.value-a.value);
  const group=el('div',null,'language-line');
  const lead=el('span',null,'language-primary');
  lead.append(el('span',ranking[0].label,'lang-name'),
              el('span',(100*ranking[0].value).toFixed(2),'lang-number'),
              el('span','%','lang-percent'));
  group.append(lead);
  const tail=el('span',null,'language-tail');
  for(let i=1;i<ranking.length;i++){
    const item=ranking[i],piece=el('span',null,'entry');
    piece.append(el('span','/','slash'),el('span',item.label+' '+pct(item.value)));
    tail.append(piece);
  }
  group.append(tail);parent.append(group);
  parent.append(el('div','判断：语言来源为'+ranking[0].label,'language-verdict'));
}

function scoreTable(parent,task,preferred){
  const cols=preferred.filter(cls=>task.classes.includes(cls));
  const wrap=el('div',null,'tablewrap'),table=el('table'),thead=el('thead'),tr=el('tr');
  for(const value of ['模型','融合权重','最大类别',...cols.map(c=>LABELS[c]||c)])tr.append(el('th',value));
  thead.append(tr);table.append(thead);
  const tbody=el('tbody');
  for(const key of ['linear','complement_nb','cnn','bigru']){
    const model=task.model_scores[key];
    if(!model)continue;
    const row=el('tr');
    row.append(el('td',key),el('td',pct(model.weight),'num'),el('td',LABELS[model.top]||model.top));
    for(const col of cols)row.append(el('td',pct(model.probabilities[task.classes.indexOf(col)]),'num'));
    tbody.append(row);
  }
  const fused=el('tr',null,'raw-fusion');
  fused.append(el('td','原始融合'),el('td','-','num'),el('td',LABELS[task.label]||task.label));
  for(const col of cols)fused.append(el('td',pct(task.probabilities[task.classes.indexOf(col)]),'num'));
  tbody.append(fused);table.append(tbody);wrap.append(table);parent.append(wrap);
}
let embeddedOpenCCPromise=null;
function loadEmbeddedOpenCC(){
 if(embeddedOpenCCPromise)return embeddedOpenCCPromise;
 embeddedOpenCCPromise=(async()=>{
   const element=$('opencc-zip-b64');
   const encoded=element?.textContent.trim();
   if(!encoded)throw Error('HTML 内未找到 OpenCC 压缩资源');
   if(typeof DecompressionStream!=='function')throw Error('浏览器不支持内置 ZIP 解压');
   const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
   const header=new DataView(bytes.buffer);
   if(header.getUint32(0,true)!==0x04034b50)throw Error('OpenCC ZIP 格式不正确');
   if(header.getUint16(8,true)!==8 || (header.getUint16(6,true)&1))
      throw Error('OpenCC ZIP 不是受支持的 Deflate 格式');
   const length=header.getUint32(18,true);
   const offset=30+header.getUint16(26,true)+header.getUint16(28,true);
   if(!length || offset+length>bytes.length)throw Error('OpenCC ZIP 数据不完整');
   const compressed=bytes.subarray(offset,offset+length);
   const source=await new Response(
     new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
   ).text();
   const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
   try{
     await new Promise((resolve,reject)=>{
       const script=document.createElement('script');
       script.src=url;
       script.onload=()=>{script.remove();resolve();};
       script.onerror=()=>{script.remove();reject(Error('无法执行 OpenCC 脚本'));};
       document.head.append(script);
     });
   }finally{URL.revokeObjectURL(url);}
   const api=window.OpenCC;
   if(!api || typeof api.Converter!=='function')throw Error('OpenCC 浏览器接口不可用');
   const jp=api.Converter({from:'jp',to:'cn'});
   const toCn=api.Converter({from:'t',to:'cn'});
   return value=>toCn(jp(value)).replaceAll('郞','郎');
 })().catch(error=>{embeddedOpenCCPromise=null;throw error;});
 return embeddedOpenCCPromise;
}
function updateConversionWarning(){
 $('conversion-warning').hidden=$('convert-simplify').checked;
}
async function classify(){
  resetResult();const out=$('result'),name=$('name').value.trim();
  if(active!==selected()||!MODEL_CACHE.has(active)){out.append(el('p','请先加载选中的模型。','error-message'));return;}
  if(!name){out.append(el('p','请输入姓名。','error-message'));return;}
  try{
    const normalized=($('convert-simplify').checked && /[\u3400-\u9fff]/.test(name))\n      ? (await loadEmbeddedOpenCC())(name.normalize('NFKC')) : name;\n    const result=NSZGRM.predict(normalized,MODEL_CACHE.get(active));
    if(result.error){out.append(el('p',result.error,'error-message'));return;}
    const fixed=correctedResult(result.name,result);
    out.append(el('h3','书写类型'));
    writingDisplay(out,result.writing_type,fixed);
    out.append(el('hr',null,'divider'));
    out.append(el('h3','语言来源'));
    languageDisplay(out,result.language_proxy);
    out.append(el('h4','书写类型的原始评分'));
    scoreTable(out,result.writing_type,WRITING_COLUMNS);
    out.append(el('h4','语言来源的原始评分'));
    scoreTable(out,result.language_proxy,LANGUAGE_COLUMNS);
  }catch(e){out.append(el('p','推理失败：'+e.message,'error-message'));}
}
$('load').addEventListener('click',loadServer);
$('download').addEventListener('click',downloadFile);
$('local').addEventListener('click',()=>{if(!busy)$('file').click();});
$('file').addEventListener('change',e=>localFile(e.target.files[0]));
$('restore').addEventListener('click',restore);
$('clear').addEventListener('click',clearCache);
$('run').addEventListener('click',classify);
$('convert-simplify').addEventListener('change',updateConversionWarning);
updateConversionWarning();
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')classify();});
for(const r of document.querySelectorAll('input[name="variant"]'))r.addEventListener('change',resetResult);
