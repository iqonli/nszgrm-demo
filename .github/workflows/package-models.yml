name: Package two NSZGRM models

on:
  push:
    paths:
      - .github/workflows/package-models.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download two models from the completed training release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download research-v3-44065315717 \
            --repo mifuler/nszgrm \
            --pattern nszgrm-models-44065315717.zip \
            --dir "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/nszgrm-models-44065315717.zip" "$RUNNER_TEMP/two-models" <<'PY'
          import pathlib
          import shutil
          import sys
          import zipfile

          target = pathlib.Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for filename in ('models_fp32.json', 'models_int8.json'):
                  matches = [item for item in archive.infolist()
                             if not item.is_dir() and pathlib.PurePosixPath(item.filename).name == filename]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one {filename}, found {len(matches)}; ZIP entries: {archive.namelist()}')
                  with archive.open(matches[0]) as source, (target / filename).open('wb') as output:
                      shutil.copyfileobj(source, output)
                  if (target / filename).stat().st_size == 0:
                      raise SystemExit(f'{filename} extracted empty')
                  print(f'{matches[0].filename} -> {filename}: {(target / filename).stat().st_size} bytes')
          PY

      - name: Compress with maximum 7z LZMA2 settings
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          mkdir -p "$GITHUB_WORKSPACE/model"
          cd "$RUNNER_TEMP/two-models"
          7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=256m -ms=on -mmt=on \
            "$GITHUB_WORKSPACE/model/2model-2026-11-17.7z" \
            models_fp32.json models_int8.json
          7z t "$GITHUB_WORKSPACE/model/2model-2026-11-17.7z"

      - name: Commit the archive to model/
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model/2model-2026-11-17.7z
          if ! git diff --cached --quiet; then
            git commit -m 'Add compressed FP32 and INT8/16 models'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
