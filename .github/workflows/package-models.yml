name: Package two NSZGRM models

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    paths:
      - '.github/workflows/package-models.yml'

permissions:
  contents: write

concurrency:
  group: nszgrm-demo-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find latest audited model Release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          req=urllib.request.Request(
              'https://api.github.com/repos/mifuler/nszgrm/releases?per_page=100',
              headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'User-Agent':'nszgrm-demo-package-models'
              })
          with urllib.request.urlopen(req,timeout=45) as response:
              releases=json.load(response)
          matches=[]
          for release in releases:
              m=re.fullmatch(r'research-v3-(\d+)',release.get('tag_name',''))
              if not m or release.get('draft') or release.get('prerelease'):
                  continue
              run_id=m.group(1)
              name=f'nszgrm-models-{run_id}.7z'
              if any(a.get('name')==name and a.get('state')=='uploaded' and a.get('size',0)>0
                     for a in release.get('assets',[])):
                  matches.append((int(run_id),name))
          if not matches:
              raise SystemExit('No published audited model 7z found')
          run_id,name=max(matches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run_id={run_id}\nasset={name}\n')
          print('Selected audited run',run_id,name)
          PY

      - name: Download and extract FP32 + INT8 models
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ASSET: ${{ steps.source.outputs.asset }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/two-models"
          gh release download "research-v3-$RUN_ID"             --repo mifuler/nszgrm             --pattern "$ASSET" --dir "$RUNNER_TEMP/source"
          7z t "$RUNNER_TEMP/source/$ASSET"
          7z x -y "$RUNNER_TEMP/source/$ASSET" -o"$RUNNER_TEMP/extracted"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'extracted'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'two-models'
          expected={'models_fp32.json','models_int8.json'}
          for name in sorted(expected):
              found=[p for p in source.rglob(name) if p.is_file() and p.name==name]
              if len(found)!=1:raise SystemExit(f'Expected exactly one {name}, found {len(found)}')
              shutil.copyfile(found[0],dest/name)
              data=json.loads((dest/name).read_text('utf-8'))
              tasks=data.get('models') or {}
              for task,n in [('writing',3),('language',8)]:
                  block=tasks.get(task)
                  if not block or len(block.get('classes',[]))!=n:
                      raise SystemExit(f'{name}: {task} missing {n} classes')
                  if any(arch not in block.get('models',{}) for arch in
                         ('linear','complement_nb','cnn','bigru')):
                      raise SystemExit(f'{name}: {task} missing architecture')
              print(name,(dest/name).stat().st_size,'bytes')
          if (dest/'models_int8.json').stat().st_size >= 15_000_000:
              raise SystemExit('Quantized model exceeds 15 MB')
          PY

      - name: Recompress models and update the two HTML MiB values
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/two-models" &&             7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=256m -ms=on -mmt=on               "$GITHUB_WORKSPACE/model/2model-2026-11-17.7z"               models_fp32.json models_int8.json)
          7z t model/2model-2026-11-17.7z
          python3 - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          a=root/'index.html'
          data=a.read_text('utf-8')
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'two-models'
          for key,name in [('quant','models_int8.json'),('fp32','models_fp32.json')]:
              mib=(source/name).stat().st_size/1048576
              pattern=r'(<input\s+type="radio"\s+name="variant"\s+value="'+key+r'"[^>]*>\s*<span><strong>[^<]+</strong><small>'+name+r'\s+)[0-9.]+(?:\s*(?:MB|MiB))(</small>)'
              data,count=re.subn(pattern,lambda m:m.group(1)+f'{mib:.2f}MiB'+m.group(2),data,count=1)
              if count!=1:raise SystemExit('Cannot find one existing UI model size for '+name)
              print(name, f'{mib:.2f} MiB')
          a.write_text(data,'utf-8')
          PY

      - name: Commit updated model archive and HTML size labels
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model/2model-2026-11-17.7z index.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync audited models from mifuler run $RUN_ID"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Model archive and two MiB labels already current.'
          fi
